server:
  host: "0.0.0.0"
  port: 8000
  reload: true

database:
  path: "outputs/lab6.db"

camera:
  default_source: "0"
  width: 640
  height: 480
  fps: 12
  fallback_to_simulated: true
  flip_mode: "horizontal"  # Hỗ trợ: "none", "horizontal", "vertical", "both"

processing:
  resize_width: 320
  resize_height: 240
  threshold_value: 120
  canny_low: 80
  canny_high: 160
  brightness_threshold: 70
  filters:
    - resize
    - grayscale
    - threshold
    - edge
  available_filters:
    - resize
    - grayscale
    - threshold
    - edge
    - gaussian_blur
    - histogram_equalize
    - sobel_x
    - sobel_y

motion:
  method: "mog2"
  seconds: 3
  min_area: 800
  motion_score_threshold: 800
  simple_threshold: 25
  warmup_frames: 5
  min_contour_area: 120
  cooldown_seconds: 3
  mog2_history: 500
  mog2_var_threshold: 16
  detect_shadows: true

person_detection:
  enabled: true
  detector_mode: "opencv_hog_person"
  motion_overlap_threshold: 0.03
  min_motion_pixels_in_bbox: 150
  hog_hit_threshold: 0.0

quality:
  brightness_min: 35
  brightness_max: 230
  blur_min_variance: 100.0

debug:
  save_failed_frame: false

mqtt:
  enabled: true
  broker: "localhost"
  port: 1883
  client_id: "lab6_camera"
  topic_prefix: "aiot/lab6"
  qos: 1

logging:
  level: "INFO"
  file: "outputs/lab6.log"
